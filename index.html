<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Grade 9 Timetable</title>
<link rel="manifest" href="manifest.json">
<script>
const manifestLink=document.querySelector('link[rel="manifest"]');
const colorScheme=matchMedia('(prefers-color-scheme: dark)');
function updateManifest(){manifestLink.href=colorScheme.matches?'manifest-dark.json':'manifest.json'}
updateManifest();
colorScheme.addEventListener('change',updateManifest);
</script>
<style>
:root{--bg:#f7f7f8;--tx:#1c1c1e;--mu:#8a8a90;--ac:#2f5bff;--seg:#e8e8ec;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#000;--tx:#f2f2f7;--mu:#7c7c84;--ac:#5b7cff;--seg:#1c1c1e;--on:#3a3a3c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{height:100vh;height:100dvh;margin:0;background:var(--bg);color:var(--tx);font:500 17px/1.3 system-ui,-apple-system,sans-serif;padding:max(16px,env(safe-area-inset-top)) 14px 0}
main{width:100%;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
header{flex:none;padding:0 18px 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:clamp(30px,6dvh,44px);line-height:1;margin:0 0 5px;font-weight:800;letter-spacing:-1.5px}
.mu{color:var(--mu)}
.icon{flex:none;width:42px;height:42px;border:0;border-radius:50%;background:var(--seg);color:var(--tx);display:grid;place-items:center;cursor:pointer;transition:transform .18s ease,background .18s ease}
.icon:hover{transform:translateY(-1px)}
.icon svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.seg{position:fixed;z-index:5;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;width:min(452px,calc(100% - 28px));background:color-mix(in srgb,var(--seg) 88%,transparent);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid rgba(128,128,128,.16);border-radius:28px;padding:5px;margin:0;box-shadow:0 8px 28px rgba(0,0,0,.2)}
.seg button{border:0;background:rgba(128,128,128,.1);color:var(--mu);font:inherit;font-size:15px;font-weight:600;height:42px;min-width:0;border-radius:21px;position:relative}
.seg button.on{background:var(--on);color:var(--tx);box-shadow:0 2px 7px rgba(0,0,0,.12)}
.seg button.td::after{content:"";position:absolute;left:calc(50% - 2px);bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--ac)}
#list{display:flex;flex:1;flex-direction:column;min-height:0;justify-content:space-evenly;gap:8px;padding:4px 0 8px}
.r{display:grid;grid-template-columns:minmax(76px,25%) minmax(0,1fr);align-items:center;gap:10px;flex:1 1 0;min-height:0;padding:8px 12px;border-radius:18px;border:1px solid rgba(128,128,128,.12);background:rgba(128,128,128,.04);font-variant-numeric:tabular-nums;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.t{font-size:clamp(11px,2.4dvh,14px);white-space:nowrap;color:var(--mu)}
.s{display:flex;flex-direction:column;justify-content:center;min-width:0;gap:4px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.18);font-size:clamp(15px,min(3.4dvh,5.5vw),22px);line-height:1.1;font-weight:650;word-break:break-word;overflow-wrap:anywhere}
.s small{display:block;font-size:clamp(11px,2.2dvh,14px);line-height:1.05;font-weight:500;margin-top:1px;opacity:.8}
.g .s{font-size:clamp(12px,2.5dvh,14px);font-weight:500;color:var(--mu)}
.past{opacity:.35}
.now{background:var(--ac);color:#fff;border-color:transparent}.now .t{color:rgba(255,255,255,.75)}.now .s{background:rgba(255,255,255,.14)}
#end{flex:none;padding:0 18px}
#install{border:0;border-radius:18px;background:var(--ac);color:#fff;font:inherit;font-size:14px;font-weight:650;padding:10px 16px;margin-top:12px}
#install[hidden]{display:none}
.settings{padding:8px 18px}
.settings h2{font-size:22px;margin:10px 0 6px}
.settings p{color:var(--mu);margin:0 0 20px}
.classes{display:flex;flex-direction:column;gap:10px}
.classes button{display:flex;align-items:center;justify-content:center;min-height:58px;padding:0 18px;border:1px solid rgba(128,128,128,.2);border-radius:18px;background:var(--seg);color:var(--tx);font:inherit;font-weight:650;text-align:center;white-space:normal;line-height:1.2}
.classes button.on{background:var(--ac);color:#fff}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="timetablePage">
<header>
<div class="top"><h1 id="h"></h1><button class="icon" id="settingsButton" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 2.7v2.1M12 19.2v2.1M4.93 4.93l1.5 1.5M17.57 17.57l1.5 1.5M2.7 12h2.1M19.2 12h2.1M4.93 19.07l1.5-1.5M17.57 6.43l1.5-1.5"></path></svg></button></div>
<div class="mu" id="d"></div><button id="install" type="button" hidden>Install app</button>
</header>
<div id="list" aria-live="polite"></div>
<div class="mu" id="end"></div>
<div class="seg" id="days" aria-label="Choose a weekday"></div>
</section>
<section id="settingsPage" class="settings" hidden>
<div class="top"><h1>Settings</h1><button class="icon" id="backButton" type="button" aria-label="Back to timetable"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button></div>
<h2>Choose your class</h2>
<p>Your choice is saved on this device.</p>
<div class="classes" id="classChoices"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
let timetable;
let selectedClass=localStorage.getItem('grade9-class')||'A';
let F=[];
const classNames=['A','B','C','D','E'];
const g=time=>{const [h,m]=time.split(':').map(Number);return (h+6)*60+m};
const tt=period=>`${period.start}–${period.end}`;
const dur=m=>m>=60?`${Math.floor(m/60)}h ${p(m%60)}m`:`${m} min`;
const p=n=>String(n).padStart(2,'0');
const wd=new Date().getDay()-1;let sel=wd>=0&&wd<5?wd:0;
function items(day){
 const periods=timetable.periods,subjects=timetable.classes[selectedClass][day],o=[];
 periods.forEach((period,i)=>{
  if(i===3)o.push({period:{start:'4:15',end:'4:30'},label:'Break'});
  if(i===5)o.push({period:{start:'6:00',end:'7:40'},label:'Lunch'});
  o.push({period,subject:subjects[i]});
 });
 return o.map(item=>({...item,start:g(item.period.start),end:g(item.period.end)}));
}
function render(){
 if(!timetable)return;
 const dt=new Date(),now=dt.getHours()*60+dt.getMinutes(),td=sel==wd,l=items(F[sel]);
 $('h').textContent=`Grade 9${selectedClass}`;
 $('d').textContent=dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
 $('days').innerHTML=F.map((f,i)=>`<button type="button" class="${i===sel?'on ':''}${i===wd?'td':''}" data-day="${i}" aria-pressed="${i===sel}">${f.slice(0,3)}</button>`).join('');
 $('list').innerHTML=l.map(x=>{
  const st=td?(now>=x.end?'past':now>=x.start?'now':''):'';
  if(x.label)return `<div class="r g ${st}"><span class="t">${tt(x.period)}</span><span class="s">${x.label}</span></div>`;
  const subject=x.subject?timetable.subjects[x.subject]||x.subject:'Add subject';
  return `<div class="r ${st}"><span class="t">${tt(x.period)}</span><span class="s">${subject}${st==='now'?`<small>Ends in ${dur(x.end-now)}</small>`:''}</span></div>`}).join('');
 const done=td&&now>=l[l.length-1].end,n=(sel+1)%5;
 const nextSubject=timetable.classes[selectedClass][F[n]][0];
 $('end').textContent=done?`Done for today. ${F[n]} starts with ${nextSubject?timetable.subjects[nextSubject]||nextSubject:'a blank period'}.`:'';
 $('classChoices').innerHTML=classNames.map(name=>`<button type="button" data-class="${name}" class="${selectedClass===name?'on':''}" aria-pressed="${selectedClass===name}">Grade 9${name}</button>`).join('');
}
function showSettings(show){
 $('settingsPage').hidden=!show;
 $('timetablePage').hidden=show;
}
$('settingsButton').addEventListener('click',()=>showSettings(true));
$('backButton').addEventListener('click',()=>showSettings(false));
$('days').addEventListener('click',event=>{
 const button=event.target.closest('button[data-day]');
 if(button){sel=Number(button.dataset.day);render()}
});
$('classChoices').addEventListener('click',event=>{
 const button=event.target.closest('button[data-class]');
 if(button){selectedClass=button.dataset.class;localStorage.setItem('grade9-class',selectedClass);render();showSettings(false)}
});
async function loadTimetable(){
 try{
  const response=await fetch('./timetable.json');
  if(!response.ok)throw new Error(`Timetable request failed: ${response.status}`);
  timetable=await response.json();
  if(!Array.isArray(timetable.days)||timetable.days.length!==5||!Array.isArray(timetable.periods)||timetable.periods.length!==8)throw new Error('Timetable must define five days and eight periods.');
  if(classNames.some(name=>!timetable.classes[name]||timetable.days.some(day=>!Array.isArray(timetable.classes[name][day])||timetable.classes[name][day].length!==8)))throw new Error('Each class needs eight period entries for every day.');
  if(timetable.periods.some(period=>typeof period.start!=='string'||typeof period.end!=='string'))throw new Error('Every period needs a start and end time.');
  F=timetable.days;
  if(!classNames.includes(selectedClass)||!timetable.classes[selectedClass])selectedClass='A';
  render();
 }catch(error){
  console.error('Could not load timetable:',error);
  $('list').innerHTML='<p role="alert">Could not load the timetable. Check that timetable.json is available and valid.</p>';
 }
}
loadTimetable();setInterval(render,30000);
let installPrompt;
const installButton=$('install');
window.addEventListener('beforeinstallprompt',event=>{
 event.preventDefault();
 installPrompt=event;
 installButton.hidden=false;
});
installButton.addEventListener('click',async()=>{
 if(!installPrompt)return;
 installButton.disabled=true;
 try{
  await installPrompt.prompt();
  await installPrompt.userChoice;
 }finally{
  installPrompt=null;
  installButton.hidden=true;
  installButton.disabled=false;
 }
});
window.addEventListener('appinstalled',()=>{
 installPrompt=null;
 installButton.hidden=true;
});
if('serviceWorker' in navigator){
    const hadController=Boolean(navigator.serviceWorker.controller);
    let reloadedAfterUpdate=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
        if(hadController&&!reloadedAfterUpdate){
            reloadedAfterUpdate=true;
            window.location.reload();
        }
    });
    window.addEventListener('load',async()=>{
        try{
            const registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
            await registration.update();
        }catch(error){
            console.warn('Service worker registration failed:',error);
        }
 });
}
</script>
</body>
</html>
